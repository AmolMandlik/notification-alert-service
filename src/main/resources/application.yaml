server:
  port: 8083

spring:
  application:
    name: notification-alert-service

  # ── PostgreSQL ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Kafka ───────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-alert-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.frauddetection.detection.model.dto,com.frauddetection.notification.model.dto"
        spring.json.value.default.type: com.frauddetection.notification.model.dto.FraudDecisionEvent
        spring.json.use.type.headers: false
        enable.auto.commit: false
        max.poll.records: 10
    listener:
      ack-mode: MANUAL_IMMEDIATE

# ── Kafka topic names ────────────────────────────────────
app:
  kafka:
    topic:
      payment-decisions: payment-decisions

  # ── Notification config ──────────────────────────────────
  notification:
    # Simulated in POC — replace with real SMTP/SMS gateway in production
    simulate: true
    ops-email: fraud-ops@bank.com
    customer-email-domain: "@bank.com"

# ── Actuator ────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always